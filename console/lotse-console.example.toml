# Copy to lotse-console.toml and adjust.
listen = "127.0.0.1:8080"

# Every request acts as this user. Only for a machine only you can reach;
# OIDC sign-in is not implemented yet.
[auth]
mode = "dev"
user = "pierre"

# The background sampler that feeds the charts uses this read-only identity.
[metrics]
principal = "console-metrics"
sample_secs = 10
retention_hours = 24

[live]
interval_ms = 2000

# A real cluster: client addresses of some of its nodes; the others are
# learnt from them. Lotse has no authentication yet, so the console
# connects without credentials.
# [[clusters]]
# id = "prod-hamburg-1"
# kind = "native"
# bootstrap = ["broker-1:9000", "broker-2:9000", "broker-3:9000"]

# A built-in cluster with sample data.
[[clusters]]
id = "demo"
kind = "demo"
