# Copy to lotse-console.toml and adjust.
listen = "127.0.0.1:8080"
# data_dir = "data"   # what outlives a restart (the session key); relative to this file

# Every request acts as this user. Only for a machine only you can reach.
# `password` is the user's SCRAM password where the cluster requires
# authentication.
[auth]
mode = "dev"
user = "pierre"
# password = "…"

# Or: users sign in at your identity provider, the issuer the brokers trust.
# Register the console there as a client with this redirect URL.
# [auth]
# mode = "oidc"
# issuer = "https://id.example.com/realms/ops"
# client_id = "lotse-console"
# client_secret = "…"          # for a confidential client; PKCE is always used
# redirect_url = "https://console.example.com/auth/callback"
# principal_claim = "sub"       # the same claim the brokers use
# ca_file = "/etc/lotse/idp-ca.pem"   # a private issuer's CA
# session_key_file = "/var/lib/lotse-console/session.key"   # made at the first start if missing; default <data_dir>/session.key
# session_hours = 12

# The background sampler that feeds the charts uses this identity; bind it a
# viewer role in every tenant. Each user's chart sums only the streams and
# queues they may see.
[metrics]
principal = "console-metrics"
# password = "…"                                  # SCRAM, or:
# client_id = "lotse-console-metrics"             # OAuth client credentials
# client_secret_file = "/etc/lotse/metrics-secret"
# issuer = "https://id.example.com/realms/ops"    # default: auth.issuer
sample_secs = 10
retention_hours = 24

[live]
interval_ms = 2000

# A real cluster: client addresses of some of its nodes; the others are
# learnt from them. The console signs in to it as each user.
# [[clusters]]
# id = "prod-hamburg-1"
# kind = "native"
# bootstrap = ["broker-1:9000", "broker-2:9000", "broker-3:9000"]
# ca_file = "/etc/lotse/ca.pem"

# A built-in cluster with sample data.
[[clusters]]
id = "demo"
kind = "demo"
