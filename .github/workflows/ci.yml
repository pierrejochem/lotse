name: ci

# Every push to main and every pull request: format, lint and tests, the web
# app, the packaging and the SDK. The simulations at depth run in the release
# workflow, before anything is released (ADR 0088).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  console-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console/web
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/web/package-lock.json
      - run: npm ci
      # The committed OpenAPI file and generated client must match the server.
      - run: |
          cargo run -q -p lotse-console -- --print-openapi > openapi.json
          npx openapi-typescript openapi.json -o src/api/schema.d.ts
          git diff --exit-code openapi.json src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The packaging (ADR 0049): the image builds from source and the binary in
  # it starts; the Debian package builds and holds the unit.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          # No nightly run fills the release cache any more: main's packaging does.
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - uses: taiki-e/install-action@v2
        with:
          tool: cargo-deb
      - run: cargo deb -p lotse-node
      - run: sudo dpkg -i target/debian/*.deb
      - run: lotse --version && getent passwd lotse
      - run: systemd-analyze verify /lib/systemd/system/lotse@.service
      - run: docker build -f packaging/Dockerfile -t lotse:ci .
      - run: docker run --rm lotse:ci --version

  # The client SDKs (ADR 0056, ADR 0083): the vectors drift check, the Java
  # tests with and without the codec libraries, the TLS and real-node tests
  # against the lotse executable built here, the Kotlin layer's tests, and both
  # builds' examples; then the C# tests (with the codecs, and a project without)
  # and the Node.js tests on Node.js 24, which has zstd.
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
          save-if: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-dotnet@v5
        with:
          global-json-file: sdk/csharp/global.json
          cache: true
          cache-dependency-path: sdk/csharp/**/*.csproj
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json
      - run: cargo build -p lotse-node
      - run: make sdk-test
        env:
          LOTSE_BIN: ${{ github.workspace }}/target/debug/lotse

  # The Node.js SDK on the oldest Node.js it supports (20): zstd is not in
  # node:zlib there, lz4 and everything else must work. A job of its own so the
  # required check `sdk` keeps its name.
  sdk-node-20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
          save-if: false
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json
      - run: cargo build -p lotse-node
      - run: make sdk-node-test
        env:
          LOTSE_BIN: ${{ github.workspace }}/target/debug/lotse
