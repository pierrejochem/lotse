name: ci

# Every push to main and every pull request: format, lint and tests, the web
# app, the packaging and the SDK. The simulations at depth run in the release
# workflow, before anything is released (ADR 0088).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always
  # Nodes and tests log their groups' elections and the node loop's stalls, so a
  # test that fails because a group had no leader shows when and why (ADR 0139).
  LOTSE_LOG: info,lotse::raft=debug,lotse::stall=debug

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  console-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console/web
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/web/package-lock.json
      - run: npm ci
      # The committed OpenAPI file and generated client must match the server.
      - run: |
          cargo run -q -p lotse-console -- --print-openapi > openapi.json
          npx openapi-typescript openapi.json -o src/api/schema.d.ts
          git diff --exit-code openapi.json src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  # The packaging (ADR 0049, ADR 0126): the release script builds the x86_64
  # release with the pinned tools; the .deb installs and holds the units on
  # this systemd runner, and runs a node under sysvinit in a Debian
  # container, the .apk under OpenRC in an Alpine container, the .rpm in a
  # Fedora container; the image builds from source and its binary starts.
  # Reproducibility is checked in the release workflow.
  packaging:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release-dist
          workspaces: ". -> target/release-dist"
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: packaging/tools.sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      # The Node.js release.env pins, for the console's web app (ADR 0137).
      - run: grep '^NODE_VERSION=' packaging/release.env >> "$GITHUB_ENV"
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - run: packaging/release.sh --arch amd64 0.0.0-ci
      - run: tar -tzf dist/lotse-0.0.0-ci-linux-amd64.tar.gz
      - run: tar -tzf dist/lotse-console-0.0.0-ci-linux-amd64.tar.gz
      - run: sudo apt-get install -y ./dist/lotse_*_amd64.deb
      - run: lotse --version && getent passwd lotse
      - run: systemd-analyze verify /usr/lib/systemd/system/lotse@.service
      - run: test "$(systemctl is-enabled lotse.service || true)" = masked
      - run: docker run --rm -v "$PWD:/src" -w /src debian:12 sh packaging/ci/sysvinit.sh
      - run: docker run --rm -v "$PWD:/src" -w /src alpine:3.22 sh packaging/ci/openrc.sh
      - run: docker run --rm -v "$PWD:/src" -w /src fedora:42 sh packaging/ci/rpm.sh
      # The console's packages (ADR 0137).
      - run: sudo apt-get install -y ./dist/lotse-console_*_amd64.deb
      - run: lotse-console --version && getent passwd lotse-console
      - run: systemd-analyze verify /usr/lib/systemd/system/lotse-console.service
      - run: docker run --rm -v "$PWD:/src" -w /src debian:12 sh packaging/ci/console-sysvinit.sh
      - run: docker run --rm -v "$PWD:/src" -w /src alpine:3.22 sh packaging/ci/console-openrc.sh
      - run: docker run --rm -v "$PWD:/src" -w /src fedora:42 sh packaging/ci/console-rpm.sh
      - run: docker build -f packaging/Dockerfile -t lotse:ci .
      - run: docker run --rm lotse:ci --version
      - run: docker build -f packaging/Dockerfile.console -t lotse-console:ci .
      - run: docker run --rm lotse-console:ci --version
      - run: packaging/ci/helm.sh

  # The client SDKs (ADR 0056, ADR 0083): the vectors drift check, the Java
  # tests with and without the codec libraries, the TLS and real-node tests
  # against the lotse executable built here, the Kotlin layer's tests, and both
  # builds' examples; then the C# tests (with the codecs, and a project without)
  # and the Node.js tests on Node.js 24, which has zstd.
  sdk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
          save-if: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: "21"
      - uses: gradle/actions/setup-gradle@v6
      - uses: actions/setup-dotnet@v6
        with:
          global-json-file: sdk/csharp/global.json
          cache: true
          cache-dependency-path: sdk/csharp/**/*.csproj
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json
      - run: cargo build -p lotse-node
      - run: mkdir -p "$RUNNER_TEMP/lotse-tmp"
      - run: make sdk-test
        env:
          LOTSE_BIN: ${{ github.workspace }}/target/debug/lotse
          TMPDIR: ${{ runner.temp }}/lotse-tmp
          JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ runner.temp }}/lotse-tmp
      # Nodes started by the SDK tests write their logs under TMPDIR; on a
      # failure, show their elections and stalls (ADR 0139).
      - name: Elections and stalls of the test nodes
        if: failure()
        run: |
          find "$RUNNER_TEMP/lotse-tmp" -name '*.log' -print0 2>/dev/null | while IFS= read -r -d '' f; do
            if grep -qE 'lotse::(raft|stall)' "$f"; then
              echo "::group::$f"
              grep -E 'lotse::(raft|stall)' "$f" | sed 's/\x1b\[[0-9;]*m//g' | tail -n 400
              echo "::endgroup::"
            fi
          done

  # The Node.js SDK on the oldest Node.js it supports (20): zstd is not in
  # node:zlib there, lz4 and everything else must work. A job of its own so the
  # required check `sdk` keeps its name.
  sdk-node-20:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: debug
          save-if: false
      - uses: actions/setup-node@v7
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: sdk/node/package-lock.json
      - run: cargo build -p lotse-node
      - run: mkdir -p "$RUNNER_TEMP/lotse-tmp"
      - run: make sdk-node-test
        env:
          LOTSE_BIN: ${{ github.workspace }}/target/debug/lotse
          TMPDIR: ${{ runner.temp }}/lotse-tmp
          JAVA_TOOL_OPTIONS: -Djava.io.tmpdir=${{ runner.temp }}/lotse-tmp
      # Nodes started by the SDK tests write their logs under TMPDIR; on a
      # failure, show their elections and stalls (ADR 0139).
      - name: Elections and stalls of the test nodes
        if: failure()
        run: |
          find "$RUNNER_TEMP/lotse-tmp" -name '*.log' -print0 2>/dev/null | while IFS= read -r -d '' f; do
            if grep -qE 'lotse::(raft|stall)' "$f"; then
              echo "::group::$f"
              grep -E 'lotse::(raft|stall)' "$f" | sed 's/\x1b\[[0-9;]*m//g' | tail -n 400
              echo "::endgroup::"
            fi
          done
