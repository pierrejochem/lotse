name: ci

on:
  push:
    branches: [main]
  pull_request:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  console-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console/web
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/web/package-lock.json
      - run: npm ci
      # The committed OpenAPI file and generated client must match the server.
      - run: |
          cargo run -q -p lotse-console -- --print-openapi > openapi.json
          npx openapi-typescript openapi.json -o src/api/schema.d.ts
          git diff --exit-code openapi.json src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Many more seeds than the default test run. A failure prints the seed;
      # reproduce it locally with LOTSE_SIM_SEED=<seed> cargo test -p lotse-sim.
      - run: cargo test -p lotse-sim -p lotse-server --release
        env:
          LOTSE_SIM_SEEDS: "5000"
