name: ci

on:
  push:
    branches: [main]
  pull_request:
  # Nightly: the client, queue, group, metadata, access, retention,
  # compaction and membership simulations at full depth (ADRs 0027, 0031,
  # 0033, 0034, 0039, 0046, 0048, 0067).
  schedule:
    - cron: "17 2 * * *"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
      - run: cargo fmt --all --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace

  console-web:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console/web
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: console/web/package-lock.json
      - run: npm ci
      # The committed OpenAPI file and generated client must match the server.
      - run: |
          cargo run -q -p lotse-console -- --print-openapi > openapi.json
          npx openapi-typescript openapi.json -o src/api/schema.d.ts
          git diff --exit-code openapi.json src/api/schema.d.ts
      - run: npm run typecheck
      - run: npm test
      - run: npm run build

  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      # Many more seeds than the default test run. A failure prints the seed;
      # reproduce it locally with LOTSE_SIM_SEED=<seed> cargo test -p lotse-sim.
      - run: cargo test -p lotse-sim -p lotse-server --release -- --skip clients_see_only_committed_data --skip queues_lose_nothing --skip a_consumer_group_processes --skip resources_created_changed_and_deleted --skip nothing_is_allowed_that_no_binding_allowed --skip retention_deletes_only_what_it_may --skip nodes_come_and_go_without_losing_anything --skip compaction_keeps_each_keys_newest_record
        env:
          LOTSE_SIM_SEEDS: "5000"

  # The client simulation is the slowest, so it runs next to the others in a
  # job of its own (ADR 0030): 2,000 seeds on pushes and pull requests, 5,000
  # nightly and on manual runs (ADR 0027).
  client-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p lotse-server --release --test clients
        env:
          LOTSE_SIM_SEEDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '5000' || '2000' }}

  # The queue simulation, in a job of its own like the client simulation
  # (ADR 0031): 2,000 seeds on pushes and pull requests, 5,000 nightly.
  queue-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p lotse-server --release --test queues
        env:
          LOTSE_SIM_SEEDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '5000' || '2000' }}

  # The consumer group simulation, in a job of its own (ADR 0033): 1,000
  # seeds on pushes and pull requests (it is the slowest per seed), 5,000
  # nightly.
  group-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p lotse-server --release --test groups
        env:
          LOTSE_SIM_SEEDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '5000' || '1000' }}

  # The metadata simulation, in a job of its own (ADR 0034): 2,000 seeds on
  # pushes and pull requests, 5,000 nightly.
  metadata-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p lotse-server --release --test metadata
        env:
          LOTSE_SIM_SEEDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '5000' || '2000' }}

  # The access simulation, in a job of its own (ADR 0039): role bindings
  # change under load on a faulty cluster; 1,000 seeds on pushes and pull
  # requests, 5,000 nightly.
  access-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p lotse-server --release --test access_sim
        env:
          LOTSE_SIM_SEEDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '5000' || '1000' }}

  # The retention simulation, in a job of its own (ADR 0046): short limits
  # and small segments under faults; 1,000 seeds on pushes and pull
  # requests, 5,000 nightly.
  retention-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p lotse-server --release --test retention
        env:
          LOTSE_SIM_SEEDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '5000' || '1000' }}

  # The compaction simulation, in a job of its own (ADR 0067): compacted
  # streams under faults, every replica read in turn; 1,000 seeds on pushes
  # and pull requests, 5,000 nightly.
  compaction-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p lotse-server --release --test compaction
        env:
          LOTSE_SIM_SEEDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '5000' || '1000' }}

  # The membership simulation, in a job of its own (ADR 0048): nodes added
  # and drained under load and faults; 1,000 seeds on pushes and pull
  # requests, 5,000 nightly.
  membership-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo test -p lotse-server --release --test membership
        env:
          LOTSE_SIM_SEEDS: ${{ (github.event_name == 'schedule' || github.event_name == 'workflow_dispatch') && '5000' || '1000' }}

  # The packaging (ADR 0049): the image builds from source and the binary in
  # it starts; the Debian package builds and holds the unit.
  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
      - run: cargo install --locked cargo-deb
      - run: cargo deb -p lotse-node
      - run: sudo dpkg -i target/debian/*.deb
      - run: lotse --version && getent passwd lotse
      - run: systemd-analyze verify /lib/systemd/system/lotse@.service
      - run: docker build -f packaging/Dockerfile -t lotse:ci .
      - run: docker run --rm lotse:ci --version
