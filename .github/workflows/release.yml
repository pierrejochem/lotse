name: release
# On a version tag (ADR 0049, ADR 0126): first every simulation at full
# depth, 5,000 seeds each (ADR 0088); only when all of them pass, the release
# is built twice, by packaging/release.sh on two runners in two directories,
# and the two must match byte for byte: static `lotse` binaries for x86_64
# and aarch64, tarballs, .deb, .rpm and .apk packages, BUILDINFO and
# SHA256SUMS. The image for both architectures is built twice the same way.
# Then the GitHub release and ghcr.io/<owner>/lotse publish exactly the bytes
# that were compared. Run by hand on any branch, it runs the simulations and
# both reproducibility checks, and publishes nothing.
# A failing simulation prints the seed; reproduce it with
# LOTSE_SIM_SEED=<seed> cargo test -p <crate> --release --test <file>.
on:
  push:
    tags: ["v*"]
  workflow_dispatch:

# Only the jobs that publish may write.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: true
      # Many more seeds than the default test run. A failure prints the seed;
      # reproduce it locally with LOTSE_SIM_SEED=<seed> cargo test -p lotse-sim.
      - run: cargo test -p lotse-sim -p lotse-server --release -- --skip clients_see_only_committed_data --skip queues_lose_nothing --skip a_consumer_group_processes --skip resources_created_changed_and_deleted --skip nothing_is_allowed_that_no_binding_allowed --skip retention_deletes_only_what_it_may --skip nodes_come_and_go_without_losing_anything --skip compaction_keeps_each_keys_newest_record
        env:
          LOTSE_SIM_SEEDS: "5000"

  # The client simulation is the slowest, so it runs next to the others in a
  # job of its own (ADR 0030).
  client-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      - run: cargo test -p lotse-server --release --test clients
        env:
          LOTSE_SIM_SEEDS: "5000"

  # The queue simulation (ADR 0031).
  queue-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      - run: cargo test -p lotse-server --release --test queues
        env:
          LOTSE_SIM_SEEDS: "5000"

  # The consumer group simulation (ADR 0033), the slowest per seed.
  group-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      - run: cargo test -p lotse-server --release --test groups
        env:
          LOTSE_SIM_SEEDS: "5000"

  # The metadata simulation (ADR 0034): creating, changing and deleting.
  metadata-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      - run: cargo test -p lotse-server --release --test metadata
        env:
          LOTSE_SIM_SEEDS: "5000"

  # The access simulation (ADR 0039): role bindings change under load on a
  # faulty cluster.
  access-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      - run: cargo test -p lotse-server --release --test access_sim
        env:
          LOTSE_SIM_SEEDS: "5000"

  # The retention simulation (ADR 0046): short limits and small segments
  # under faults.
  retention-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      - run: cargo test -p lotse-server --release --test retention
        env:
          LOTSE_SIM_SEEDS: "5000"

  # The compaction simulation (ADR 0067): compacted streams under faults,
  # every replica read in turn.
  compaction-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      - run: cargo test -p lotse-server --release --test compaction
        env:
          LOTSE_SIM_SEEDS: "5000"

  # The membership simulation (ADR 0048): nodes added and drained under load
  # and faults.
  membership-simulation:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: release
          save-if: false
      - run: cargo test -p lotse-server --release --test membership
        env:
          LOTSE_SIM_SEEDS: "5000"

  # The release, built twice: here, and in `reproduce` on another runner in
  # another directory with another CARGO_HOME. `compare` lets nothing
  # through unless every file matches.
  build:
    needs:
      - simulation
      - client-simulation
      - queue-simulation
      - group-simulation
      - metadata-simulation
      - access-simulation
      - retention-simulation
      - compaction-simulation
      - membership-simulation
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - run: packaging/tools.sh && echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Version
        # A branch run builds 0.0.0-check: the same for both builds.
        run: |
          case $GITHUB_REF in
            refs/tags/v*) echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV" ;;
            *) echo "VERSION=0.0.0-check" >> "$GITHUB_ENV" ;;
          esac
      - run: packaging/release.sh "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/
  reproduce:
    needs:
      - simulation
      - client-simulation
      - queue-simulation
      - group-simulation
      - metadata-simulation
      - access-simulation
      - retention-simulation
      - compaction-simulation
      - membership-simulation
    runs-on: ubuntu-24.04
    env:
      CARGO_HOME: ${{ github.workspace }}/../elsewhere-cargo
    steps:
      - uses: actions/checkout@v7
        with:
          path: some/other/place
      - run: |
          echo "$CARGO_HOME/bin" >> "$GITHUB_PATH"
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - run: some/other/place/packaging/tools.sh
      - name: Version
        run: |
          case $GITHUB_REF in
            refs/tags/v*) echo "VERSION=${GITHUB_REF_NAME#v}" >> "$GITHUB_ENV" ;;
            *) echo "VERSION=0.0.0-check" >> "$GITHUB_ENV" ;;
          esac
      - run: some/other/place/packaging/release.sh "$VERSION"
      - uses: actions/upload-artifact@v7
        with:
          name: dist-again
          path: some/other/place/dist/
  compare:
    needs: [build, reproduce]
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: a
      - uses: actions/download-artifact@v8
        with:
          name: dist-again
          path: b
      - name: The two builds match byte for byte
        run: |
          cat a/BUILDINFO
          cat a/SHA256SUMS
          diff a/SHA256SUMS b/SHA256SUMS
          diff -r a b
          (cd a && sha256sum -c --quiet SHA256SUMS)

  # The image, built twice from the compared binaries on a base pinned by its
  # digest, with every timestamp the commit's: `image` and `image-again` must
  # give the same index digest. Publishing pushes the archive `image` built.
  image:
    needs: compare
    runs-on: ubuntu-24.04
    outputs:
      base: ${{ steps.base.outputs.base }}
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - uses: docker/setup-buildx-action@v4
      - name: Base image by digest
        id: base
        run: |
          digest=$(docker buildx imagetools inspect gcr.io/distroless/static-debian12:nonroot --format '{{json .Manifest}}' | jq -r .digest)
          echo "base=gcr.io/distroless/static-debian12@$digest" >> "$GITHUB_OUTPUT"
      - id: build
        run: packaging/image.sh dist "${{ steps.base.outputs.base }}" image.tar
      - uses: actions/upload-artifact@v7
        with:
          name: image
          path: image.tar
  image-again:
    needs: image
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
        with:
          path: some/other/place
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: some/other/place/dist
      - uses: docker/setup-buildx-action@v4
      - id: build
        working-directory: some/other/place
        run: packaging/image.sh dist "${{ needs.image.outputs.base }}" /tmp/image.tar
      - name: The two images match
        run: |
          echo "image:       ${{ needs.image.outputs.digest }}"
          echo "image-again: ${{ steps.build.outputs.digest }}"
          test "${{ needs.image.outputs.digest }}" = "${{ steps.build.outputs.digest }}"

  release:
    needs: [compare, image, image-again]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: dist
          path: dist
      - name: Release
        env:
          GH_TOKEN: ${{ github.token }}
          IMAGE: ghcr.io/${{ github.repository_owner }}/lotse
        run: |
          {
            echo "Built twice and compared byte for byte (ADR 0126); \`packaging/release.sh --verify SHA256SUMS ${GITHUB_REF_NAME#v}\` checks it again."
            echo
            echo "Image: \`${IMAGE,,}:$GITHUB_REF_NAME\`, index digest \`${{ needs.image.outputs.digest }}\`, on \`${{ needs.image.outputs.base }}\`."
            echo
            echo '```'
            cat dist/BUILDINFO
            echo '```'
          } > notes.md
          gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --notes-file notes.md --generate-notes
  publish-image:
    needs: [compare, image, image-again]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: image
          path: .
      - name: Push the compared archive
        env:
          TOKEN: ${{ github.token }}
        run: |
          image="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/lotse"
          command -v skopeo >/dev/null || { sudo apt-get update -qq && sudo apt-get install -y -qq skopeo; }
          echo "$TOKEN" | skopeo login ghcr.io --username "${{ github.actor }}" --password-stdin
          for tag in "$GITHUB_REF_NAME" latest; do
            skopeo copy --all --preserve-digests oci-archive:image.tar "docker://$image:$tag"
          done
          pushed=$(skopeo inspect --raw "docker://$image:$GITHUB_REF_NAME" | sha256sum | cut -d' ' -f1)
          test "sha256:$pushed" = "${{ needs.image.outputs.digest }}"
