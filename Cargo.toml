[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/pierrejochem/lotse"
publish = false

[workspace.dependencies]
lotse-rt = { path = "crates/lotse-rt" }
lotse-record = { path = "crates/lotse-record" }
lotse-log = { path = "crates/lotse-log" }
lotse-sim = { path = "crates/lotse-sim" }
lotse-raft = { path = "crates/lotse-raft" }
lotse-server = { path = "crates/lotse-server" }
lotse-rt-tokio = { path = "crates/lotse-rt-tokio" }
lotse-proto = { path = "crates/lotse-proto" }
lotse-client = { path = "crates/lotse-client" }
lotse-queue = { path = "crates/lotse-queue" }
lotse-route = { path = "crates/lotse-route" }
lotse-auth = { path = "crates/lotse-auth" }

bytes = "1.7"
crc32c = "0.6"
lz4_flex = { version = "0.14", default-features = false, features = ["frame", "std", "safe-decode", "safe-encode"] }
zstd = { version = "0.14", default-features = false }
thiserror = "2"
proptest = "1.5"
tokio = "1.40"
# TLS 1.3 in lotse-rt-tokio, with the ring provider (no C toolchain beyond cc).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
x509-parser = "0.18"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem", "x509-parser"] }
time = { version = "0.3", default-features = false, features = ["std"] }
tracing = "0.1"
# Authentication in lotse-auth: SCRAM-SHA-512 and JWT validation.
sha2 = "0.11"
hmac = "0.13"
pbkdf2 = { version = "0.13", default-features = false, features = ["hmac"] }
base64 = "0.22"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = { version = "1", default-features = false, features = ["std", "perf", "unicode"] }
# Configuration files of the console and the node binary.
toml = "1.2"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
# Version 10 has no crypto backend by default; rust_crypto is pure Rust, so the static builds need no C toolchain beyond the one ring has.
jsonwebtoken = { version = "10", default-features = false, features = ["rust_crypto"] }
# Roots for fetching an identity provider's keys over HTTPS.
webpki-roots = "1"
# Signing test tokens (lotse-auth's testing feature) and sealing console sessions; already in the tree through rustls.
ring = "0.17"
# Host metrics in lotse-rt-tokio; 0.36 is the newest that builds on rust-version 1.85.
sysinfo = { version = "0.36", default-features = false, features = ["system", "disk"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# The core is sans-I/O: nothing outside lotse-rt implementations may read the
# wall clock or the OS RNG, or the simulation stops being deterministic.
disallowed_methods = "deny"
disallowed_types = "deny"

[profile.test]
opt-level = 1
