[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.0.1"
edition = "2024"
rust-version = "1.85"
license = "Apache-2.0"
repository = "https://github.com/pierrejochem/lotse"
publish = false

[workspace.dependencies]
lotse-rt = { path = "crates/lotse-rt" }
lotse-record = { path = "crates/lotse-record" }
lotse-log = { path = "crates/lotse-log" }
lotse-sim = { path = "crates/lotse-sim" }
lotse-raft = { path = "crates/lotse-raft" }
lotse-server = { path = "crates/lotse-server" }
lotse-rt-tokio = { path = "crates/lotse-rt-tokio" }
lotse-proto = { path = "crates/lotse-proto" }
lotse-client = { path = "crates/lotse-client" }
lotse-queue = { path = "crates/lotse-queue" }
lotse-route = { path = "crates/lotse-route" }

bytes = "1.7"
crc32c = "0.6"
thiserror = "2"
proptest = "1.5"
tokio = "1.40"
# TLS 1.3 in lotse-rt-tokio, with the ring provider (no C toolchain beyond cc).
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "logging"] }
tokio-rustls = { version = "0.26", default-features = false, features = ["ring"] }
x509-parser = "0.17"
rcgen = { version = "0.13", default-features = false, features = ["ring", "pem"] }
tracing = "0.1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# Host metrics in lotse-rt-tokio; 0.36 is the newest that builds on rust-version 1.85.
sysinfo = { version = "0.36", default-features = false, features = ["system", "disk"] }

[workspace.lints.rust]
unsafe_code = "forbid"
missing_debug_implementations = "warn"

[workspace.lints.clippy]
all = { level = "warn", priority = -1 }
# The core is sans-I/O: nothing outside lotse-rt implementations may read the
# wall clock or the OS RNG, or the simulation stops being deterministic.
disallowed_methods = "deny"
disallowed_types = "deny"

[profile.test]
opt-level = 1
