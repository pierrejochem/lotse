[package]
name = "lotse-node"
description = "The lotse binary: runs one node of a cluster from a cluster file"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[[bin]]
name = "lotse"
path = "src/main.rs"

[dependencies]
lotse-server.workspace = true
lotse-client.workspace = true
lotse-proto.workspace = true
lotse-rt-tokio.workspace = true
lotse-log.workspace = true
lotse-record.workspace = true
lotse-rt.workspace = true
lotse-auth.workspace = true
lotse-mcp.workspace = true
rmcp = { workspace = true, features = ["server", "transport-io", "transport-streamable-http-server"] }
serde_json.workspace = true
bytes.workspace = true
rcgen.workspace = true
x509-parser.workspace = true
sha2.workspace = true
time.workspace = true
serde.workspace = true
thiserror.workspace = true
toml.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros", "signal", "time", "io-std"] }

[dev-dependencies]
base64.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
lotse-rt-tokio = { workspace = true, features = ["dev-certs"] }

[lints]
workspace = true
