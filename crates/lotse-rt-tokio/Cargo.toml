[package]
name = "lotse-rt-tokio"
description = "The production implementation of lotse-rt on Tokio and the local file system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lotse-rt.workspace = true
bytes.workspace = true
tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "time", "fs"] }

[dev-dependencies]
lotse-log.workspace = true
lotse-record.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
