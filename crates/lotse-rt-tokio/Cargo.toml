[package]
name = "lotse-rt-tokio"
description = "The production implementation of lotse-rt on Tokio and the local file system"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lotse-rt.workspace = true
bytes.workspace = true
sysinfo.workspace = true
thiserror.workspace = true
tracing.workspace = true
rustls.workspace = true
tokio-rustls.workspace = true
x509-parser.workspace = true
webpki-roots.workspace = true
ring.workspace = true
rcgen = { workspace = true, optional = true }
time = { workspace = true, optional = true }
tokio = { workspace = true, features = ["rt", "net", "io-util", "sync", "time", "fs", "macros"] }

[features]
# A throwaway CA for tests and local clusters.
dev-certs = ["dep:rcgen", "dep:time"]

[dev-dependencies]
lotse-rt-tokio = { path = ".", features = ["dev-certs"] }
lotse-log.workspace = true
lotse-record.workspace = true
tokio = { workspace = true, features = ["rt-multi-thread", "macros"] }

[lints]
workspace = true
