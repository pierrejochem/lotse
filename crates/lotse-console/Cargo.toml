[package]
name = "lotse-console"
description = "Lotse management console: web UI and HTTP gateway on a dedicated node"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
base64.workspace = true
bytes.workspace = true
lotse-client.workspace = true
lotse-proto.workspace = true
lotse-record.workspace = true
lotse-route.workspace = true
lotse-rt.workspace = true
lotse-rt-tokio.workspace = true
async-trait = "0.1"
axum = { version = "0.8", features = ["ws"] }
clap = { version = "4.5", features = ["derive"] }
futures-util = { version = "0.3", default-features = false, features = ["sink", "std"] }
mime_guess = "2"
rust-embed = "8.5"
serde.workspace = true
serde_json.workspace = true
sha2.workspace = true
thiserror.workspace = true
tokio = { version = "1.40", features = ["macros", "rt-multi-thread", "net", "sync", "time", "signal"] }
toml = "0.8"
tracing.workspace = true
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
utoipa = "5"

[dev-dependencies]
lotse-auth = { workspace = true, features = ["testing"] }
lotse-rt-tokio = { workspace = true, features = ["dev-certs"] }
lotse-log.workspace = true
lotse-raft.workspace = true
lotse-server.workspace = true
http-body-util = "0.1"
tower = { version = "0.5", features = ["util"] }

[lints]
workspace = true
