[package]
name = "lotse-proto"
description = "The Lotse native protocol: frames, error codes and the request and response types"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
publish.workspace = true

[dependencies]
lotse-record.workspace = true
bytes.workspace = true
thiserror.workspace = true

[dev-dependencies]
crc32c.workspace = true
# The SCRAM exchanges in the conformance vectors come from the broker's own implementation.
lotse-auth.workspace = true
# Exchange routing in the conformance vectors comes from the client's and the broker's routing.
lotse-route.workspace = true

[features]
