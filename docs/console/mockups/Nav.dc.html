<script type="text/x-dc" data-dc-script data-props='{"current":{"editor":"enum","options":["overview","nodes","streams","queues","messages","tenants"],"default":"overview"},"$preview":{"width":240,"height":960}}'>
class Component extends DCLogic {
  renderVals() {
    const current = this.props.current ?? 'overview';
    const keys = ['overview', 'nodes', 'streams', 'queues', 'exchanges', 'groups', 'messages', 'tenants', 'access', 'audit', 'settings'];
    const base = 'display: flex; align-items: center; gap: 10px; min-height: 36px; box-sizing: border-box; padding: 8px 12px; border-radius: 8px; font-size: 14px; line-height: 20px; text-decoration: none; ';
    const st = {}, ic = {}, cur = {};
    for (const k of keys) {
      const on = k === current;
      st[k] = base + (on ? 'background: rgba(255,255,255,0.10); color: #FFFFFF; font-weight: 600;' : 'color: #C9D6DF; font-weight: 400;');
      ic[k] = 'display: flex; color: ' + (on ? '#F0645A' : '#9DB0BE') + ';';
      cur[k] = on ? 'page' : undefined;
    }
    return { st, ic, cur };
  }
}
</script>
